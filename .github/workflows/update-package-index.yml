name: 更新选包页索引

# 生成选包页索引根本不需要编译。tmp/.packageinfo 是 include/scan.mk 在
# make defconfig 阶段扫描全部 feeds 产生的，那时候一行代码都还没编。之所
# 以以前要等两个多小时，纯粹是因为这一步被夹在完整构建流程里。
#
# 单拎出来跑十分钟就够：初始化环境 + 克隆源码 + feeds + defconfig。
# 改了 selector/ 下的东西想看效果，或者 feeds 更新了想刷新清单，都用它。
run-name: "更新选包页索引 · ${{ inputs.repo_branch }}"

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '给哪条线生成索引'
        required: true
        default: '两条线都生成'
        type: choice
        options:
          - 两条线都生成
          - openwrt-25.12-XG-040G-MD
          - master-XG-040G-MD
      device_variant:
        description: '设备变体（仅 master 分支有效）'
        required: true
        default: 'ubi'
        type: choice
        options:
          - tcboot
          - stock
          - ubi

env:
  REPO_URL: https://github.com/Loong1996/immortalwrt.git
  TZ: Asia/Shanghai

jobs:
  Index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      # 两条线互不相干，一条挂了另一条照样出索引
      fail-fast: false
      # 并发推 gh-pages 会撞车，交给发布步骤里的重试逻辑处理
      matrix:
        branch: ${{ fromJSON(inputs.repo_branch == '两条线都生成'
          && '["openwrt-25.12-XG-040G-MD","master-XG-040G-MD"]'
          || format('["{0}"]', inputs.repo_branch)) }}

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

    - name: Clone Source Code(克隆源代码)
      run: |
        # 只要元数据，不需要历史
        git clone --depth 1 "$REPO_URL" -b "${{ matrix.branch }}" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        echo "SRC_INFO=$(git show -s --format='%h %s')" >> $GITHUB_ENV

    - name: Generate Variables(生成变量)
      run: |
        # 与构建流程保持一致：只有 master 线是显式匹配，其余落进 25.12 的默认
        case "${{ matrix.branch }}" in
          master-XG-040G-MD)
            CONFIG_FILE=config/xg-040g-md-master.config
            case "${{ inputs.device_variant }}" in
              tcboot) DEVICE_SYMBOL=nokia_xg-040g-md-tcboot ;;
              stock)  DEVICE_SYMBOL=nokia_xg-040g-md ;;
              ubi)    DEVICE_SYMBOL=nokia_xg-040g-md-ubi ;;
              *)      echo "::error::不支持的 device_variant"; exit 1 ;;
            esac
            ;;
          *)
            CONFIG_FILE=config/xg-040g-md.config
            DEVICE_SYMBOL=bell_xg-040g-md
            ;;
        esac
        echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
        echo "DEVICE_SYMBOL=$DEVICE_SYMBOL" >> $GITHUB_ENV
        echo "INDEX_TAG=索引 $(date +%Y-%m-%d) #${{ github.run_number }}" >> $GITHUB_ENV
        echo "使用配置: $CONFIG_FILE    设备: $DEVICE_SYMBOL"

    - name: Install Feeds(安装feeds)
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Run defconfig(生成元数据)
      run: |
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        # 设备符号影响 defconfig 补全出来的包集合，也就是索引里"依赖带入"
        # 那一档。不设对设备，那一档就是错的。
        sed -i "/^CONFIG_TARGET_airoha_an7581_DEVICE_/d" .config
        sed -i "/^# CONFIG_TARGET_airoha_an7581_DEVICE_/d" .config
        sed -i "/^CONFIG_TARGET_airoha_an7581=y/a CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config
        # 这一步只读元数据、不编译，是整个流程里最慢的一环（几分钟）
        make defconfig
        grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config \
          || { echo "::error::defconfig 后设备符号丢失: $DEVICE_SYMBOL"; exit 1; }
        [ -s tmp/.packageinfo ] || { echo "::error::未生成 tmp/.packageinfo"; exit 1; }
        echo "元数据条目数: $(grep -c '^Package: ' tmp/.packageinfo)"

    - name: Build Index(生成索引)
      run: |
        PAGES="$RUNNER_TEMP/pages"
        mkdir -p "$PAGES"
        python3 "$GITHUB_WORKSPACE/selector/build-index.py" \
          "$OPENWRT_PATH/tmp/.packageinfo" \
          "$OPENWRT_PATH/.config" \
          "$GITHUB_WORKSPACE/$CONFIG_FILE" \
          "${{ matrix.branch }}" "$INDEX_TAG ($SRC_INFO)" \
          "$PAGES/packages-${{ matrix.branch }}.json"

    - name: Publish To Pages(发布到选包页)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash "$GITHUB_WORKSPACE/scripts/publish-pages.sh" \
          "$RUNNER_TEMP/pages" \
          "选包页：更新 ${{ matrix.branch }} 索引（$INDEX_TAG）"
