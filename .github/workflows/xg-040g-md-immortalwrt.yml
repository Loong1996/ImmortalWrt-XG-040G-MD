name: XG-040G-MD

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '选择编译分支'
        required: true
        default: 'openwrt-25.12-XG-040G-MD'
        type: choice
        options:
          - master-XG-040G-MD
          - openwrt-25.12-XG-040G-MD
      device_variant:
        description: '设备变体（仅 master 分支有效，25.12 分支忽略）'
        required: true
        default: 'tcboot'
        type: choice
        options:
          - tcboot
          - stock
          - ubi
      dram_size:
        description: '板上内存颗粒容量（换过颗粒才需要改）'
        required: true
        default: '1G'
        type: choice
        options:
          - 512M
          - 1G
          - 2G

env:
  DRAM_SIZE: ${{ github.event.inputs.dram_size }}
  DEVICE_VARIANT: ${{ github.event.inputs.device_variant }}
  REPO_URL: https://github.com/Loong1996/immortalwrt.git
  # REPO_BRANCH 将由 workflow_dispatch 输入动态设置
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md.config
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限；仅授予 contents，其余 scope 自动为 none
    # 需配合仓库设置 Settings → Actions → General → Workflow permissions
    # 选择 "Read and write permissions"，否则此声明会被仓库级只读设置压制
    permissions:
      contents: write

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt -yqq install dos2unix
        sudo -E apt -yqq install libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks(合并磁盘)
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone Source Code(克隆源代码)
      env:
        REPO_BRANCH: ${{ github.event.inputs.repo_branch }}
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV

    - name: Patch DRAM Size(修改内存容量)
      if: env.DRAM_SIZE != ''
      run: |
        cd $OPENWRT_PATH
        # 两条线的 memory 节点位置与写法都不同：
        #   25.12 线  dts/an7581-bell_xg-040g-md.dts，usable-memory-range 单行
        #   master 线 dts/an758x-nokia_xg-040g-common.dtsi，该属性跨两行书写
        # 因此按内容定位文件，并用容忍空白与换行的正则改写。
        DTS=$(grep -rl "linux,usable-memory-range" target/linux/airoha/dts/ 2>/dev/null | grep -i "xg-040g" | head -n1)
        [ -n "$DTS" ] || { echo "::error::未找到含 usable-memory-range 的 XG-040G dts"; exit 1; }
        echo "目标文件: $DTS"

        case "$DRAM_SIZE" in
          512M) MEM_SIZE=0x20000000; USABLE_SIZE=0x1fe00000 ;;
          1G)   MEM_SIZE=0x40000000; USABLE_SIZE=0x3fe00000 ;;
          2G)   MEM_SIZE=0x80000000; USABLE_SIZE=0x7fe00000 ;;
          *)    echo "::error::不支持的 DRAM_SIZE=$DRAM_SIZE"; exit 1 ;;
        esac

        python3 - "$DTS" "$MEM_SIZE" "$USABLE_SIZE" <<'PY'
        import re, sys
        path, mem, usable = sys.argv[1], sys.argv[2], sys.argv[3]
        s = open(path, encoding="utf-8").read()
        # memory 节点：DRAM 基址 0x80000000，大小改为实际颗粒容量
        s, n1 = re.subn(r"(reg\s*=\s*<0x0\s+0x80000000\s+0x0\s+)0x[0-9a-fA-F]+(\s*>\s*;)",
                        lambda m: m.group(1) + mem + m.group(2), s)
        # chosen/linux,usable-memory-range：跳过 0x80000000 起 2MB 的 ATF 保留区
        s, n2 = re.subn(r"(linux,usable-memory-range\s*=\s*<0x0\s+0x80200000\s+0x0\s+)0x[0-9a-fA-F]+(\s*>\s*;)",
                        lambda m: m.group(1) + usable + m.group(2), s)
        if n1 != 1 or n2 != 1:
            print("::error::替换次数异常 memory=%d usable=%d（期望各 1 次）" % (n1, n2))
            sys.exit(1)
        open(path, "w", encoding="utf-8").write(s)
        print("已改写 memory=%s usable=%s" % (mem, usable))
        PY

        echo "--- 修改后 ---"
        grep -nE "usable-memory-range|0x80000000|0x80200000" "$DTS"

    - name: Generate Variables(生成变量)
      run: |
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        # 两条线的配置与设备符号都不同：
        #   25.12 线  自制 bell_xg-040g-md，内核 6.12，只有这一个设备
        #   master 线 上游原生，内核 6.18，三个变体由 device_variant 输入选择
        case "$REPO_BRANCH" in
          master-XG-040G-MD)
            CONFIG_FILE=config/xg-040g-md-master.config
            case "$DEVICE_VARIANT" in
              tcboot) DEVICE_SYMBOL=nokia_xg-040g-md-tcboot ;;
              stock)  DEVICE_SYMBOL=nokia_xg-040g-md ;;
              ubi)    DEVICE_SYMBOL=nokia_xg-040g-md-ubi ;;
              *)      echo "::error::不支持的 device_variant=$DEVICE_VARIANT"; exit 1 ;;
            esac
            FLAVOR="$DEVICE_VARIANT"
            ;;
          *)
            CONFIG_FILE=config/xg-040g-md.config
            DEVICE_SYMBOL=bell_xg-040g-md
            FLAVOR=""
            if [ "$DEVICE_VARIANT" != "tcboot" ]; then
              echo "::warning::25.12 分支只有 bell_xg-040g-md 一个设备，已忽略 device_variant=$DEVICE_VARIANT"
            fi
            ;;
        esac
        echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
        echo "DEVICE_SYMBOL=$DEVICE_SYMBOL" >> $GITHUB_ENV
        echo "FLAVOR=$FLAVOR" >> $GITHUB_ENV
        echo "使用配置: $CONFIG_FILE    设备: $DEVICE_SYMBOL"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        # 25.12 线只有一个设备，FLAVOR 为空则不插入该段
        echo "RELEASE_TAG=XG-040G-MD${FLAVOR:+-$FLAVOR}-$DRAM_SIZE-$(date +"%Y%m%d")-${{ github.run_number }}" >> $GITHUB_ENV

    - name: Cache Toolchain(缓存工具链)
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}
    
    - name: Install Feeds(安装feeds)
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        # 用 cp 而非 mv：保留带注释的原始配置，供后续生成自定义软件包清单
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        # 按选定变体改写设备符号：先清掉配置里所有 an7581 设备行，再插入选中的那个
        sed -i "/^CONFIG_TARGET_airoha_an7581_DEVICE_/d" .config
        sed -i "/^# CONFIG_TARGET_airoha_an7581_DEVICE_/d" .config
        sed -i "/^CONFIG_TARGET_airoha_an7581=y/a CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config
        grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config \
          || { echo "::error::设备符号写入失败: $DEVICE_SYMBOL"; exit 1; }
        make defconfig
        grep -q "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_SYMBOL}=y" .config \
          || { echo "::error::defconfig 后设备符号丢失，$DEVICE_SYMBOL 在该源码分支中可能不存在"; exit 1; }
        echo "已选定设备: $DEVICE_SYMBOL"
        grep "CONFIG_PACKAGE_luci-app-airoha-npu" .config || echo "WARNING: option missing!"

    - name: Download DL Package(下载DL软件包)
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory(上传固件)
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        echo "VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \;)" >> $GITHUB_ENV
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Generate Custom Package List(生成自定义软件包清单)
      if: steps.compile.outputs.status == 'success'
      run: |
        SRC="$GITHUB_WORKSPACE/$CONFIG_FILE"
        OUT="$FIRMWARE_PATH/custom-packages.txt"
        [ -e "$SRC" ] || { echo "::error::未找到配置文件 $SRC"; exit 1; }
        {
          echo "XG-040G-MD 自定义软件包清单"
          echo "=================================================================="
          echo "固件版本 : $RELEASE_TAG"
          echo "编译分支 : $REPO_BRANCH"
          echo "内核版本 : $VERSION_KERNEL"
          echo "内存颗粒 : $DRAM_SIZE"
          echo "设备定义 : $DEVICE_SYMBOL"
          echo "编译时间 : $DATE"
          echo
          echo "说明"
          echo "----"
          echo "* 下列为 config/xg-040g-md.config 中显式勾选的软件包；"
          echo "  它们的依赖由 make defconfig 自动补全，未在此列出。"
          echo "* 固件实际安装的完整软件包列表见同目录下的 *.manifest 文件。"
          echo "* 本次编译使用的完整内核配置见同目录下的 build.config。"
          awk '
            $0 == "#" {
              if (pend != "") { hdr = pend; pend = "" } else { expect = 1 }
              next
            }
            expect == 1 && substr($0, 1, 2) == "# " {
              pend = substr($0, 3); expect = 0; next
            }
            {
              expect = 0
              if ($0 !~ /^CONFIG_(PACKAGE|DEFAULT)_[^=]+=y[ \t]*(#.*)?$/) next
              line = $0; comment = ""
              i = index(line, "#")
              if (i > 0) {
                comment = substr(line, i + 1)
                sub(/^[ \t]+/, "", comment)
                line = substr(line, 1, i - 1)
              }
              sub(/[ \t]+$/, "", line)
              sub(/=y$/, "", line)
              sub(/^CONFIG_PACKAGE_/, "", line)
              sub(/^CONFIG_DEFAULT_/, "", line)
              if (hdr != "") { printf "\n【%s】\n", hdr; hdr = ""; last = "" }
              norm = line; gsub(/-/, "_", norm)
              # 形如 dnsmasq_full_dnssec / luci-app-passwall_INCLUDE_Xray 的下划线子选项，归到
              # 上一个包名之下；kmod-usb-storage-uas 这类连字符独立包不受影响
              if (last != "" && index(norm, last "_") == 1 && substr(line, length(last) + 1, 1) == "_") {
                opt = substr(norm, length(last) + 2)
                sub(/^INCLUDE_/, "", opt)
                name = "    └ " opt
              } else {
                last = norm
                name = "  " line
              }
              if (comment != "") printf "%-46s # %s\n", name, comment
              else printf "%s\n", name
            }
          ' "$SRC"
          echo
          echo "使用注意"
          echo "--------"
          echo "* Passwall 与 OpenClash 不要同时启用，两者都会接管 nftables 规则链与 dnsmasq 配置。"
          echo "* dnsmasq / SmartDNS / AdGuardHome 默认均监听 53 端口，刷机后需手动规划端口分配。"
          echo "* 本固件的 DTS 已按 $DRAM_SIZE 内存颗粒适配，请勿刷入其它容量颗粒的机器。"
        } > "$OUT"
        echo "--- $OUT ---"
        cat "$OUT"

    - name: Upload Firmware To Artifact(将固件上传到Artifact)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: ${{ env.RELEASE_TAG }}
        tag: ${{ env.RELEASE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for XG-040G-MD（${{ env.DRAM_SIZE }} 内存颗粒版本）**
          ### ⚠️ 内存颗粒版本
          - 本固件为 **${{ env.DRAM_SIZE }} 内存颗粒** 版本，DTS 中的 `memory` 与 `linux,usable-memory-range` 已按 ${{ env.DRAM_SIZE }} 适配
          - **请勿刷入其它容量颗粒的机器**，颗粒容量与固件不匹配会导致无法启动
          - 未换过颗粒的原厂机器为 512M
          ### 📒 固件信息(XG-040G-MD)
          - 这是 XG-040G-MD 的专属构建
          - 🧠 内存颗粒：${{ env.DRAM_SIZE }}
          - 📐 设备定义：`${{ env.DEVICE_SYMBOL }}`
          - 💻 目标分支：${{ env.REPO_BRANCH }}
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 🌐 默认地址: 192.168.1.1
          - 🔑 默认密码: 无
          ### 🧊 固件版本
          - 固件内核版本：${{ env.VERSION_KERNEL }}
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.VERSION_INFO }}
          ### 📦 内置软件包
          - 本次编译的自定义软件包清单见下方附件 `custom-packages.txt`
          - 固件实际安装的完整包列表见附件中的 `*.manifest`，完整内核配置见 `build.config`
